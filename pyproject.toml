[project]
name = "agent-controller"
version = "0.1.0"
description = "State machine controller that drives Director / Implementer / Reviewer AI workers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph",
    "pydantic",
]

[project.scripts]
agent-controller = "agent_controller.cli:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_controller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
